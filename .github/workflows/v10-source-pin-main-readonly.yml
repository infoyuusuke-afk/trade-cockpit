name: V10 Source Pin + Guarded Startup (Synthetic)
on:
  pull_request:
    paths:
      - "downloads/VERIFY_V10_SOURCE_PIN_READONLY.ps1"
      - "tests/test_v10_readonly_source_pin_main.py"
      - "downloads/START_AI_COCKPIT_V10.ps1"
      - "downloads/START_AI_COCKPIT_V10.cmd"
      - "downloads/V10_RELEASE_BUNDLE_MANIFEST.json"
      - "docs/V10_MAIN_READONLY_SOURCE_PREFLIGHT.md"
      - "tests/test_v10_guarded_launch_main.py"
      - ".gitignore"
      - ".github/workflows/v10-source-pin-main-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source-only file contract, no PowerShell runtime
        run: python -m unittest discover -s tests -p test_v10_readonly_source_pin_main.py -v
      - name: Canonical V10 guarded start is fail-closed by default
        run: python -m unittest discover -s tests -p test_v10_guarded_launch_main.py -v
  windows-disposable-git:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse PowerShell without running startup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path = (Resolve-Path "downloads/VERIFY_V10_SOURCE_PIN_READONLY.ps1").Path
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw "V10_READONLY_POWERSHELL_PARSE_FAILED" }
          $entry = (Resolve-Path "downloads/START_AI_COCKPIT_V10.ps1").Path
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($entry,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw "V10_GUARDED_ENTRY_PARSE_FAILED" }
      - name: Positive and negative Git identity checks in disposable temp checkout only
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_readonly_source_pin_main.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guarded one-click refuses unreviewed sources, then hands to synthetic V10 mock
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_guarded_launch_main.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
