name: V10 Explicit Timezone Adapter
on:
  pull_request:
    paths:
      - "scripts/ms2_v10_timestamp_adapter.py"
      - "tests/test_ms2_v10_timestamp_adapter.py"
      - ".github/workflows/v10-timestamp-adapter.yml"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_ms2_v10_timestamp_adapter.py -v
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_ms2_v10_timestamp_adapter.py -v
