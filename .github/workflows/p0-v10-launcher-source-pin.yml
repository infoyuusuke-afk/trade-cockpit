name: V10 Launcher Source Pin (Synthetic)
on:
  pull_request:
    paths:
      - "downloads/RUN_AI_COCKPIT_V10.ps1"
      - "tests/test_v10_launcher_pin_contract.py"
      - "downloads/AI_COCKPIT_CONTROLLER_V10.ps1"
      - "downloads/STOP_AI_COCKPIT_V10.ps1"
      - "downloads/AI_COCKPIT_V10_BRAIN_PREFLIGHT.ps1"
      - "downloads/START_AI_COCKPIT_V10.cmd"
      - "tests/test_v10_brain_argv_contract.py"
      - "tests/test_v10_brain_safestop_preflight.py"
      - "tests/test_v10_brain_safestop_windows_integration.py"
      - "tests/test_v10_single_browser.py"
      - ".github/workflows/p0-v10-launcher-source-pin.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: V10 source admission contracts (no runtime)
        run: python -m unittest discover -s tests -p test_v10_launcher_pin_contract.py -v
      - name: V10 one-browser/no-order source contracts
        run: python -m unittest discover -s tests -p test_v10_single_browser.py -v
  windows-negative:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows PS5.1 wrong-branch/full-SHA fail-closed synthetic cases
        run: python -m unittest discover -s tests -p test_v10_launcher_pin_contract.py -v
  # Integration gate: stop disposable mock Controller/Python processes ONLY.
  # No Owner PC, real Excel, MS2, trading or deployment is accessed.
  windows-brain-safe-stop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact argv identity, PowerShell 5.1, synthetic paths
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_brain_argv_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_v10_brain_safestop_preflight.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real stop script with disposable mock workers ONLY
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_brain_safestop_windows_integration.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  # Exercise ACTUALLY COMMITTED V10 files. Pinned #434 is reference only.
  v10-legacy-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail-closed content parity against reviewed Draft PR 434
        shell: bash
        run: |
          set -euo pipefail
          pinned="51f9278cc4e062dfb580d1ecf98ac54b05cd0875"
          git fetch --no-tags --depth=1 origin "$pinned"
          files=(
            .github/workflows/legacy-full-suite-diagnostic.yml
            .github/workflows/mobile-control-tests.yml
            docs/P0_33_MOBILE_CI_LEGACY_SPLIT.md
            scripts/ci_legacy_v8_v9_excluded.txt
            scripts/ci_mobile_current_suite.py
            tests/test_mobile_ci_scope_contract.py
          )
          for file in "${files[@]}"; do
            git cat-file -e "$pinned:$file"
            test -f "$file"
            git show "$pinned:$file" | cmp - "$file"
            echo "PINNED_CI_CONTENT_MATCH=$file"
          done
          echo "PINNED_CI_REFERENCE_HEAD=$pinned"
      - name: Install existing Python test dependencies
        run: pip install -r requirements.txt lxml
      - name: Validate committed V10 test-scope contracts
        run: python -m unittest discover -s tests -p test_mobile_ci_scope_contract.py -v
      - name: Exercise committed V10 current suite without any overlay
        run: python scripts/ci_mobile_current_suite.py
