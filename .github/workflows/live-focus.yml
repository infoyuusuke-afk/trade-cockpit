name: Live Focus Tape

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 23 * * 0-4" # 08:00-08:55 JST, Monday-Friday
    - cron: "*/5 0-5 * * 1-5" # 09:00-14:55 JST
    - cron: "0-30/5 6 * * 1-5" # 15:00-15:30 JST

permissions:
  contents: write

concurrency:
  group: live-focus-tape
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update verified focus tape
        env:
          TZ: Asia/Tokyo
        run: python scripts/live_focus.py
      - name: Validate and publish
        run: |
          python - <<'PY'
          import json
          p=json.load(open('live_focus.json',encoding='utf-8'))
          assert p['expected_count'] <= 11
          assert all((not x['verified']) or (x['price'] and x['chart']) for x in p['rows'].values())
          k=p['rows']['285A']
          assert k['ticker']=='285A.T'
          assert k['trade_signal'] in {'見送り','売買禁止','押し目買い候補','戻り売り候補'}
          assert all(x in k for x in ('monitor_status','signal_reason','attention_state','signal_key','voice_message','setup_type','whipsaw_guard'))
          PY
          if git diff --quiet -- live_focus.json kioxia_prediction_history.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_focus.json
          test ! -f kioxia_prediction_history.json || git add kioxia_prediction_history.json
          git commit -m "Update live focus tape"
          git pull --rebase origin main
          git push
