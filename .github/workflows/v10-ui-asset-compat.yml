name: V10 UI Upgrade Compatibility
on:
  pull_request:
    paths:
      - "scripts/v10_ui_asset_gate.py"
      - "tests/test_v10_ui_asset_gate.py"
      - ".github/workflows/v10-ui-asset-compat.yml"
  workflow_dispatch:
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_v10_ui_asset_gate.py -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_v10_ui_asset_gate.py -v
