name: V10 Windows Owner Read-Only Acceptance (Synthetic)
on:
  pull_request:
    paths:
      - "downloads/V10_WINDOWS_READONLY_ACCEPTANCE.*"
      - "tests/test_v10_windows_readonly_acceptance.py"
      - "docs/V10_WINDOWS_OWNER_READONLY_ACCEPTANCE.md"
      - ".github/workflows/v10-windows-owner-readonly-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Explicit read-only launcher source contracts (no processes)
        run: python -m unittest discover -s tests -p test_v10_windows_readonly_acceptance.py -v
  windows-synthetic-proof:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell 5.1 and run proof-only -SelfTest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $pwd 'downloads/V10_WINDOWS_READONLY_ACCEPTANCE.ps1'
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw 'WINDOWS_READONLY_POWERSHELL_PARSE_FAIL' }
          $proof=@(& powershell.exe -NoLogo -NoProfile -NonInteractive -File $script -SelfTest 2>&1)
          if ($LASTEXITCODE -ne 0 -or @($proof | Where-Object { $_ -ceq 'V10_WINDOWS_READONLY_SELFTEST=PASS' }).Count -ne 1) {
            throw 'WINDOWS_READONLY_SYNTHETIC_PROOF_FAIL'
          }
          if ($proof.Count -ne 3) { throw 'WINDOWS_READONLY_EXTRA_OUTPUT' }
          'SYNTHETIC_ONLY=1'
          'REAL_SUBMIT_ALLOWED=0'
