name: V9 UI Voice Acceptance
# acceptance-retrigger: powershell args regression fix

on:
  push:
    branches:
      - "fix/v9-ui-voice-convergence"
  pull_request:
    paths:
      - "index.html"
      - "scripts/update.py"
      - "card_system.css"
      - "card_system.js"
      - "card_table_adapter.css"
      - "card_table_adapter.js"
      - "voice_client.js"
      - "downloads/AI_COCKPIT_*_V9.ps1"
      - "downloads/EXCEL_IDENTITY_PROBE_V9.ps1"
      - "downloads/CLEAR_CANONICAL_WORKBOOK_RECOVERY_V9.ps1"
      - "downloads/RESTORE_CANONICAL_WORKBOOK_RECOVERY_V9.ps1"
      - "downloads/DIAGNOSE_CANONICAL_SERIOUS_ERROR_V9.ps1"
      - "downloads/DIAGNOSE_CANONICAL_SERIOUS_ERROR_STORE_V9.ps1"
      - "downloads/DIAGNOSE_CANONICAL_DISABLED_SCOPE_V9.ps1"
      - "downloads/DIAGNOSE_CANONICAL_LOCAL_CACHE_V9.ps1"
      - "downloads/DIAGNOSE_CANONICAL_CACHE_ROLE_V9.ps1"
      - "downloads/DIAGNOSE_CANONICAL_CACHE_REST_V9.ps1"
      - "downloads/DIAGNOSE_CANONICAL_CACHE_TAIL_V9.ps1"
      - "tests/test_v9_excel_identity_probe.py"
      - "tests/test_v9_workbook_recovery_registry.py"
      - "tests/test_v9_serious_error_diagnostic.py"
      - "tests/test_v9_serious_error_store.py"
      - "tests/test_v9_disabled_scope.py"
      - "tests/test_v9_local_cache.py"
      - "tests/test_v9_cache_role.py"
      - "tests/test_v9_cache_rest.py"
      - "tests/test_v9_cache_tail.py"
      - "downloads/RUN_AI_COCKPIT_V9.ps1"
      - "downloads/STOP_AI_COCKPIT_V9.ps1"
      - "downloads/AI_COCKPIT_DEDICATED_SESSION_HOST_V1.ps1"
      - "downloads/PREPARE_AI_COCKPIT_DEDICATED_RUNTIME_V1.ps1"
      - "downloads/CREATE_AI_COCKPIT_DEDICATED_ACCOUNT_V1.ps1"
      - "downloads/SWITCH_AI_COCKPIT_V8_TO_V9.ps1"
      - "ms2_live/Kioxia_RSS_Live_Watcher.ps1"
      - "ms2_live/Kioxia_Safety_Heartbeat.ps1"
      - "ms2_live/MS2_RSS_100_Collector.ps1"
      - "ms2_live/SPEAK_TODAY_STRATEGY.ps1"
      - "ms2_live/SPEAK_LIVE_EMOTION.ps1"
      - "tests/test_v9_ui_voice_contract.py"
      - "tests/v9_visual_smoke.mjs"
      - ".github/workflows/v9-ui-voice-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout event ref without marketplace actions
        run: |
          git init .
          git remote add origin https://github.com/infoyuusuke-afk/trade-cockpit.git
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - run: python3 -m unittest discover -s tests -p "test_v9_ui_voice_contract.py"
      - run: python3 -m unittest discover -s tests -p "test_v9_excel_identity_probe.py"
      - run: python3 -m unittest discover -s tests -p "test_v9_workbook_recovery_registry.py"
      - run: python3 -m unittest discover -s tests -p "test_v9_serious_error_diagnostic.py"
      - run: python3 -m unittest discover -s tests -p "test_v9_serious_error_store.py"
      - run: python3 -m unittest discover -s tests -p "test_v9_disabled_scope.py"
      - run: python3 -m unittest discover -s tests -p "test_v9_local_cache.py"
      - run: python3 -m unittest discover -s tests -p "test_v9_cache_role.py"
      - run: python3 -m unittest discover -s tests -p "test_v9_cache_rest.py"
      - run: python3 -m unittest discover -s tests -p "test_v9_cache_tail.py"
      - run: node --check voice_client.js
      - run: node --check card_table_adapter.js
      - run: node --check opportunity_radar.js
      - run: node --check trade_control.js

  powershell-ast:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout event ref without marketplace actions
        shell: pwsh
        run: |
          git init .
          git remote add origin https://github.com/infoyuusuke-afk/trade-cockpit.git
          git fetch --depth=1 origin $env:GITHUB_REF
          git checkout --detach FETCH_HEAD
      - shell: pwsh
        run: |
          $files = @(
            "downloads/AI_COCKPIT_CONTROLLER_V9.ps1",
            "downloads/EXCEL_IDENTITY_PROBE_V9.ps1",
            "downloads/AI_COCKPIT_GATEWAY_V9.ps1",
            "downloads/CLEAR_CANONICAL_WORKBOOK_RECOVERY_V9.ps1",
            "downloads/RESTORE_CANONICAL_WORKBOOK_RECOVERY_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_SERIOUS_ERROR_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_SERIOUS_ERROR_STORE_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_DISABLED_SCOPE_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_LOCAL_CACHE_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_CACHE_ROLE_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_CACHE_REST_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_CACHE_TAIL_V9.ps1",
            "downloads/AI_COCKPIT_VOICE_BRIDGE_V9.ps1",
            "downloads/RUN_AI_COCKPIT_V9.ps1",
            "downloads/STOP_AI_COCKPIT_V9.ps1",
            "downloads/AI_COCKPIT_DEDICATED_SESSION_HOST_V1.ps1",
            "downloads/PREPARE_AI_COCKPIT_DEDICATED_RUNTIME_V1.ps1",
            "downloads/CREATE_AI_COCKPIT_DEDICATED_ACCOUNT_V1.ps1",
            "downloads/SWITCH_AI_COCKPIT_V8_TO_V9.ps1",
            "ms2_live/Kioxia_RSS_Live_Watcher.ps1",
            "ms2_live/Kioxia_Safety_Heartbeat.ps1",
            "ms2_live/MS2_RSS_100_Collector.ps1",
            "ms2_live/SPEAK_TODAY_STRATEGY.ps1",
            "ms2_live/SPEAK_LIVE_EMOTION.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ": " + $_.Message) }
              throw "PowerShell AST validation failed: $file"
            }
          }
      - name: Excel isolation safety contract
        shell: pwsh
        run: |
          $controller = Get-Content -Raw -Encoding UTF8 "downloads/AI_COCKPIT_CONTROLLER_V9.ps1"
          $watcher = Get-Content -Raw -Encoding UTF8 "ms2_live/Kioxia_RSS_Live_Watcher.ps1"
          $collector = Get-Content -Raw -Encoding UTF8 "ms2_live/MS2_RSS_100_Collector.ps1"

          $forbidden = @(
            @{ Name = "Watcher DisplayAlerts=false"; Text = $watcher; Pattern = '\$excel\.DisplayAlerts\s*=\s*\$false' },
            @{ Name = "Collector ScreenUpdating=false"; Text = $collector; Pattern = '\$excel\.ScreenUpdating\s*=\s*\$false' },
            @{ Name = "Watcher GetActiveObject Excel.Application"; Text = $watcher; Pattern = 'GetActiveObject\("Excel\.Application"\)' },
            @{ Name = "Collector GetActiveObject Excel.Application"; Text = $collector; Pattern = 'GetActiveObject\("Excel\.Application"\)' }
          )

          foreach ($rule in $forbidden) {
            if ($rule.Text -match $rule.Pattern) {
              throw ("Excel isolation safety regression: " + $rule.Name)
            }
          }

          foreach ($required in @(
            "EXCEL SAFETY INTERLOCK",
            "Get-ForeignExcelProcesses",
            "BLOCKED_FOREIGN_EXCEL",
            "isolated Excel /x"
          )) {
            if ($controller.IndexOf($required, [StringComparison]::Ordinal) -lt 0) {
              throw ("Missing Excel isolation safety marker: " + $required)
            }
          }

          if ($watcher.IndexOf("BindToMoniker", [StringComparison]::Ordinal) -lt 0) {
            throw "Watcher must bind directly to the canonical RSS workbook."
          }
          if ($collector.IndexOf("BindToMoniker", [StringComparison]::Ordinal) -lt 0) {
            throw "Collector must bind directly to the canonical RSS workbook."
          }

          foreach ($required in @(
            "RuntimeDirOverride",
            "Get-CurrentSessionId",
            "SessionId -eq",
            "MarketSpeed II in this Windows session"
          )) {
            if ($controller.IndexOf($required, [StringComparison]::Ordinal) -lt 0) {
              throw ("Missing session-isolation controller marker: " + $required)
            }
          }

          $runScript = Get-Content -Raw -Encoding UTF8 "downloads/RUN_AI_COCKPIT_V9.ps1"
          foreach ($required in @("RuntimeDirOverride", 'Root = "C:\AI_Cockpit_OneClick_Starter"')) {
            if ($runScript.IndexOf($required, [StringComparison]::Ordinal) -lt 0) {
              throw ("Missing dedicated runtime RUN marker: " + $required)
            }
          }

          $dedicatedHostText = Get-Content -Raw -Encoding UTF8 "downloads/AI_COCKPIT_DEDICATED_SESSION_HOST_V1.ps1"
          foreach ($required in @(
            "DEDICATED_SESSION_APPROVED.json",
            "explorer.exe",
            "SessionId",
            "RuntimeDirOverride",
            "MarketSpeed II is not running in dedicated session"
          )) {
            if ($dedicatedHostText.IndexOf($required, [StringComparison]::Ordinal) -lt 0) {
              throw ("Missing dedicated host marker: " + $required)
            }
          }

          $prepare = Get-Content -Raw -Encoding UTF8 "downloads/PREPARE_AI_COCKPIT_DEDICATED_RUNTIME_V1.ps1"
          foreach ($required in @(
            "DedicatedUser",
            "DEDICATED_SESSION_APPROVED.json",
            "workbook_sha256",
            "icacls.exe"
          )) {
            if ($prepare.IndexOf($required, [StringComparison]::Ordinal) -lt 0) {
              throw ("Missing dedicated preparation marker: " + $required)
            }
          }

          $accountSetup = Get-Content -Raw -Encoding UTF8 "downloads/CREATE_AI_COCKPIT_DEDICATED_ACCOUNT_V1.ps1"
          foreach ($required in @(
            "New-LocalUser",
            "standard Users group only",
            "S-1-5-32-544"
          )) {
            if ($accountSetup.IndexOf($required, [StringComparison]::Ordinal) -lt 0) {
              throw ("Missing dedicated account safety marker: " + $required)
            }
          }

      - name: Windows PowerShell 5.1 parse
        # pwsh on this runner accepts PowerShell 7 syntax such as "as [type]".
        # Owner PC starts the Controller with Windows PowerShell 5.1, so this
        # step is the parse gate. The Ubuntu unittest is not that gate.
        shell: powershell
        run: |
          $files = @(
            "downloads/AI_COCKPIT_CONTROLLER_V9.ps1",
            "downloads/EXCEL_IDENTITY_PROBE_V9.ps1",
            "downloads/AI_COCKPIT_GATEWAY_V9.ps1",
            "downloads/CLEAR_CANONICAL_WORKBOOK_RECOVERY_V9.ps1",
            "downloads/RESTORE_CANONICAL_WORKBOOK_RECOVERY_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_SERIOUS_ERROR_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_SERIOUS_ERROR_STORE_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_DISABLED_SCOPE_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_LOCAL_CACHE_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_CACHE_ROLE_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_CACHE_REST_V9.ps1",
            "downloads/DIAGNOSE_CANONICAL_CACHE_TAIL_V9.ps1"
          )
          $messages = New-Object System.Collections.Generic.List[string]
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($err in $errors) {
                [void]$messages.Add($file + ":" + $err.Extent.StartLineNumber + ":" + $err.Extent.StartColumnNumber + ": " + $err.Message)
              }
            }
          }
          if ($messages.Count -gt 0) {
            $messages | ForEach-Object { Write-Output $_ }
            throw "Windows PowerShell 5.1 parse failed"
          }
          Write-Output "WINDOWS POWERSHELL 5.1 PARSE PASS"
      - name: Canonical workbook recovery selftest
        shell: powershell
        run: |
          $ordinal = [StringComparison]::Ordinal
          $clear = @(& .\downloads\CLEAR_CANONICAL_WORKBOOK_RECOVERY_V9.ps1 -SelfTest)
          $clear | ForEach-Object { Write-Output $_ }
          if (($clear -join "`n").IndexOf("SELFTEST PASS", $ordinal) -lt 0) {
            throw "clear selftest failed"
          }
          $restore = @(& .\downloads\RESTORE_CANONICAL_WORKBOOK_RECOVERY_V9.ps1 -SelfTest)
          $restore | ForEach-Object { Write-Output $_ }
          if (($restore -join "`n").IndexOf("SELFTEST PASS", $ordinal) -lt 0) {
            throw "restore selftest failed"
          }
      - name: Canonical serious-error read-only diagnostic selftest
        shell: powershell
        run: |
          $ordinal = [StringComparison]::Ordinal
          $diag = @(& .\downloads\DIAGNOSE_CANONICAL_SERIOUS_ERROR_V9.ps1 -SelfTest)
          $diag | ForEach-Object { Write-Output $_ }
          if (($diag -join "`n").IndexOf("SELFTEST PASS", $ordinal) -lt 0) {
            throw "serious-error diagnostic selftest failed"
          }
          if (($diag -join "`n").IndexOf("PROOF primary=resiliency_recreated", $ordinal) -lt 0) {
            throw "serious-error diagnostic did not prove resiliency_recreated"
          }
          if (($diag -join "`n").IndexOf("PROOF dialog_child=1", $ordinal) -lt 0) {
            throw "serious-error diagnostic did not prove dialog_child"
          }
          if (($diag -join "`n").IndexOf("PROOF touch=parent_touch_without_surviving_value", $ordinal) -lt 0) {
            throw "serious-error diagnostic did not prove the resiliency touch scope"
          }
          if (($diag -join "`n").IndexOf("PROOF cause=workbook_crash_save", $ordinal) -lt 0) {
            throw "serious-error diagnostic did not prove workbook_crash_save"
          }
          if (($diag -join "`n").IndexOf("PROOF crash_link=no_direct_link", $ordinal) -lt 0) {
            throw "serious-error diagnostic did not prove crash_link"
          }
          if (($diag -join "`n").IndexOf("PROOF crash_causation=not_established", $ordinal) -lt 0) {
            throw "serious-error diagnostic did not prove crash causation stays unestablished"
          }
          if (($diag -join "`n").IndexOf("PROOF serious_error_link=not_established", $ordinal) -lt 0) {
            throw "serious-error diagnostic did not prove the latest crash is unlinked"
          }
          if (($diag -join "`n").IndexOf("PROOF wer_sig=ucrtbase.dll", $ordinal) -lt 0) {
            throw "serious-error diagnostic did not prove the WER signature parser"
          }
      - name: Canonical serious-error store selftest
        shell: powershell
        run: |
          $ordinal = [StringComparison]::Ordinal
          $store = @(& .\downloads\DIAGNOSE_CANONICAL_SERIOUS_ERROR_STORE_V9.ps1 -SelfTest)
          $store | ForEach-Object { Write-Output $_ }
          if (($store -join "`n").IndexOf("SELFTEST PASS", $ordinal) -lt 0) {
            throw "serious-error store selftest failed"
          }
          if (($store -join "`n").IndexOf("PROOF judgment=not_located", $ordinal) -lt 0) {
            throw "serious-error store did not prove not_located"
          }
          if (($store -join "`n").IndexOf("PROOF judgment=located_crash_needle", $ordinal) -lt 0) {
            throw "serious-error store did not prove located_crash_needle"
          }
          if (($store -join "`n").IndexOf("PROOF judgment=recent_list_not_crash_marker", $ordinal) -lt 0) {
            throw "serious-error store did not prove recent_list is not a crash marker"
          }
          if (($store -join "`n").IndexOf("PROOF judgment=session_list", $ordinal) -lt 0) {
            throw "serious-error store did not prove session_list"
          }
      - name: Canonical disabled-list scope selftest
        shell: powershell
        run: |
          $ordinal = [StringComparison]::Ordinal
          $scope = @(& .\downloads\DIAGNOSE_CANONICAL_DISABLED_SCOPE_V9.ps1 -SelfTest)
          $scope | ForEach-Object { Write-Output $_ }
          if (($scope -join "`n").IndexOf("SELFTEST PASS", $ordinal) -lt 0) {
            throw "disabled-list scope selftest failed"
          }
          if (($scope -join "`n").IndexOf("PROOF judgment=not_in_disabled_lists", $ordinal) -lt 0) {
            throw "disabled-list scope did not prove not_in_disabled_lists"
          }
          if (($scope -join "`n").IndexOf("PROOF judgment=located_disabled_list", $ordinal) -lt 0) {
            throw "disabled-list scope did not prove located_disabled_list"
          }
          if (($scope -join "`n").IndexOf("PROOF mru=flags_clear", $ordinal) -lt 0) {
            throw "disabled-list scope did not prove mru flags_clear"
          }
          if (($scope -join "`n").IndexOf("PROOF mru=flags_set", $ordinal) -lt 0) {
            throw "disabled-list scope did not prove mru flags_set"
          }
      - name: Canonical local Office cache selftest
        shell: powershell
        run: |
          $ordinal = [StringComparison]::Ordinal
          $cache = @(& .\downloads\DIAGNOSE_CANONICAL_LOCAL_CACHE_V9.ps1 -SelfTest)
          $cache | ForEach-Object { Write-Output $_ }
          if (($cache -join "`n").IndexOf("SELFTEST PASS", $ordinal) -lt 0) {
            throw "local Office cache selftest failed"
          }
          if (($cache -join "`n").IndexOf("PROOF judgment=local_cache_clear", $ordinal) -lt 0) {
            throw "local Office cache did not prove local_cache_clear"
          }
          if (($cache -join "`n").IndexOf("PROOF judgment=local_file_names_workbook", $ordinal) -lt 0) {
            throw "local Office cache did not prove local_file_names_workbook"
          }
          if (($cache -join "`n").IndexOf("PROOF judgment=local_cache_incomplete", $ordinal) -lt 0) {
            throw "local Office cache did not prove local_cache_incomplete"
          }
          if (($cache -join "`n").IndexOf("PROOF order=recovery_before_cache", $ordinal) -lt 0) {
            throw "local Office cache did not prove recovery_before_cache"
          }
      - name: Canonical cache role selftest
        shell: powershell
        run: |
          $ordinal = [StringComparison]::Ordinal
          $role = @(& .\downloads\DIAGNOSE_CANONICAL_CACHE_ROLE_V9.ps1 -SelfTest)
          $role | ForEach-Object { Write-Output $_ }
          if (($role -join "`n").IndexOf("SELFTEST PASS", $ordinal) -lt 0) {
            throw "cache role selftest failed"
          }
          if (($role -join "`n").IndexOf("PROOF judgment=name_only_not_crash_marker", $ordinal) -lt 0) {
            throw "cache role did not prove name_only_not_crash_marker"
          }
          if (($role -join "`n").IndexOf("PROOF judgment=located_crash_needle", $ordinal) -lt 0) {
            throw "cache role did not prove located_crash_needle"
          }
          if (($role -join "`n").IndexOf("PROOF judgment=name_only_cache_incomplete", $ordinal) -lt 0) {
            throw "cache role did not prove name_only_cache_incomplete"
          }
          if (($role -join "`n").IndexOf("PROOF role=recent_name", $ordinal) -lt 0) {
            throw "cache role did not prove recent_name"
          }
      - name: Canonical cache rest selftest
        shell: powershell
        run: |
          $ordinal = [StringComparison]::Ordinal
          $rest = @(& .\downloads\DIAGNOSE_CANONICAL_CACHE_REST_V9.ps1 -SelfTest)
          $rest | ForEach-Object { Write-Output $_ }
          if (($rest -join "`n").IndexOf("SELFTEST PASS", $ordinal) -lt 0) {
            throw "cache rest selftest failed"
          }
          if (($rest -join "`n").IndexOf("PROOF judgment=name_only_not_crash_marker", $ordinal) -lt 0) {
            throw "cache rest did not prove name_only_not_crash_marker"
          }
          if (($rest -join "`n").IndexOf("PROOF judgment=located_crash_needle", $ordinal) -lt 0) {
            throw "cache rest did not prove located_crash_needle"
          }
          if (($rest -join "`n").IndexOf("PROOF judgment=name_only_cache_incomplete", $ordinal) -lt 0) {
            throw "cache rest did not prove name_only_cache_incomplete"
          }
          if (($rest -join "`n").IndexOf("PROOF judgment=name_only_prefix_limited", $ordinal) -lt 0) {
            throw "cache rest did not prove name_only_prefix_limited"
          }
          if (($rest -join "`n").IndexOf("PROOF rules=filename_only", $ordinal) -lt 0) {
            throw "cache rest did not prove filename_only rules"
          }
      - name: Canonical cache tail selftest
        shell: powershell
        run: |
          $ordinal = [StringComparison]::Ordinal
          $tail = @(& .\downloads\DIAGNOSE_CANONICAL_CACHE_TAIL_V9.ps1 -SelfTest)
          $tail | ForEach-Object { Write-Output $_ }
          if (($tail -join "`n").IndexOf("SELFTEST PASS", $ordinal) -lt 0) {
            throw "cache tail selftest failed"
          }
          if (($tail -join "`n").IndexOf("PROOF judgment=name_only_not_crash_marker", $ordinal) -lt 0) {
            throw "cache tail did not prove name_only_not_crash_marker"
          }
          if (($tail -join "`n").IndexOf("PROOF judgment=located_crash_needle", $ordinal) -lt 0) {
            throw "cache tail did not prove located_crash_needle"
          }
          if (($tail -join "`n").IndexOf("PROOF judgment=no_tail_name", $ordinal) -lt 0) {
            throw "cache tail did not prove no_tail_name"
          }
          if (($tail -join "`n").IndexOf("PROOF short=65536", $ordinal) -lt 0) {
            throw "cache tail did not prove the 64KB short-file skip"
          }
      - name: Excel identity probe hard-timeout selftest
        # Windows PowerShell 5.1 is the acceptance shell. The Ubuntu
        # structural job covers the same -IdentityProbeSelfTest entry
        # through tests/test_v9_excel_identity_probe.py, whose harness
        # cap stays below the helper's 120s sleep. A green Ubuntu run
        # does not replace this step.
        shell: powershell
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & .\downloads\AI_COCKPIT_CONTROLLER_V9.ps1 -IdentityProbeSelfTest
          $sw.Stop()
          # The helper sleeps 120s. Finishing inside 90s, including Windows
          # PowerShell startup, proves the Controller killed it on the hard
          # timeout instead of waiting for that sleep.
          if ($sw.Elapsed.TotalSeconds -gt 90) {
            throw ("Identity probe selftest exceeded 90s: " + $sw.Elapsed.TotalSeconds)
          }
      - name: Runtime-bind V8 to V9 switch helpers
        shell: powershell
        run: |
          .\downloads\SWITCH_AI_COCKPIT_V8_TO_V9.ps1 -RepoRoot $PWD.Path -ExpectedSha "selftest" -SelfTest
      - name: Start VoiceBridge and probe health on Windows PowerShell
        shell: powershell
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "voicebridge-out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "voicebridge-err.log"
          $p = Start-Process powershell.exe -ArgumentList @(
            "-NoLogo","-NoProfile","-ExecutionPolicy","Bypass",
            "-File",(Resolve-Path ".\downloads\AI_COCKPIT_VOICE_BRIDGE_V9.ps1"),
            "-Port","28593"
          ) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(12)
            $ok = $false
            while((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 250
              if($p.HasExited) { break }
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:28593/health" -TimeoutSec 2
                if($r.StatusCode -eq 200) {
                  $j = $r.Content | ConvertFrom-Json
                  if($j.backend -eq "Style-Bert-VITS2" -and $j.port -eq 28593 -and $j.enabled -is [bool]) { $ok = $true; break }
                }
              } catch {}
            }
            if(-not $ok) {
              Write-Host "STDOUT:"
              Get-Content $stdout -ErrorAction SilentlyContinue
              Write-Host "STDERR:"
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "VoiceBridge failed runtime health probe"
            }
            $off = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:28593/control?enabled=0" -TimeoutSec 2
            $offJson = $off.Content | ConvertFrom-Json
            if($off.StatusCode -ne 200 -or $offJson.enabled -ne $false) { throw "VoiceBridge OFF control failed" }
            $healthOff = (Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:28593/health" -TimeoutSec 2).Content | ConvertFrom-Json
            if($healthOff.enabled -ne $false) { throw "VoiceBridge OFF state did not persist" }
            $on = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:28593/control?enabled=1" -TimeoutSec 2
            $onJson = $on.Content | ConvertFrom-Json
            if($on.StatusCode -ne 200 -or $onJson.enabled -ne $true) { throw "VoiceBridge ON control failed" }

          } finally {
            if(-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }


  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout event ref without marketplace actions
        run: |
          git init .
          git remote add origin https://github.com/infoyuusuke-afk/trade-cockpit.git
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/v9-http.log 2>&1 &
          sleep 2
          node tests/v9_visual_smoke.mjs
