name: Coordination Report Delivery Tests
on:
  pull_request:
    paths:
      - scripts/coordination_report_delivery.py
      - tests/test_coordination_report_delivery.py
      - .github/workflows/coordination-report-tests.yml
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_coordination_report_delivery.py -v
