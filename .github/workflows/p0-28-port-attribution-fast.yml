name: P0-28 Fast Port Attribution CI
on:
  pull_request:
    paths:
      - "downloads/DIAGNOSE_V10_LEGACY_PORT_OWNER_READONLY_V1.ps1"
      - "tests/test_v10_legacy_port_attribution_readonly.py"
      - "tests/test_v10_collector_encoded_init_admission.py"
      - "downloads/PREFLIGHT_V10_LEGACY_SHUTDOWN_V1.ps1"
      - "docs/V10_P0_28_PORT_OWNER_READONLY_DELIVERY.md"
      - ".github/workflows/p0-28-port-attribution-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-attribution-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse read-only script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'downloads/DIAGNOSE_V10_LEGACY_PORT_OWNER_READONLY_V1.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'P0_28_PARSE_FAILED' }
      - name: P0-28 isolated port-owner tests only (disposable dummy processes)
        run: python -m unittest discover -s tests -p test_v10_legacy_port_attribution_readonly.py -v
      - name: P0-29 exact encoded initializer admission vs injected script
        run: python -m unittest discover -s tests -p test_v10_collector_encoded_init_admission.py -v
