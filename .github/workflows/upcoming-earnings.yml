name: Upcoming Earnings Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5" # 17:30 JST（JPXが翌営業日決算発表予定会社を17時頃更新した後）

permissions:
  contents: write

concurrency:
  group: trade-cockpit-writer
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest generated state
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml
          python -m playwright install chromium
      - name: Fetch upcoming earnings and momentum lean
        env:
          TZ: Asia/Tokyo
        run: python scripts/upcoming_earnings.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upcoming_earnings.json data/earnings_predictions_log.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update upcoming earnings watch"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push upcoming earnings update after 3 attempts."
          exit 1
