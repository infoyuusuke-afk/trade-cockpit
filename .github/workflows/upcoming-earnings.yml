name: Upcoming Earnings Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5" # 17:30 JST（JPXが翌営業日決算発表予定会社を17時頃更新した後）

permissions:
  contents: write

concurrency:
  group: trade-cockpit-writer
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest generated state
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml
          python -m playwright install chromium
      - name: Test earnings failure and empty-result handling
        run: python -m unittest discover -s tests -p test_upcoming_earnings.py -v
      - name: Fetch upcoming earnings and momentum lean
        env:
          TZ: Asia/Tokyo
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/upcoming-earnings
          git rev-parse HEAD | tee artifacts/upcoming-earnings/source-commit.txt
          python -u scripts/upcoming_earnings.py 2>&1 | tee artifacts/upcoming-earnings/run.log
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output = json.loads(Path("upcoming_earnings.json").read_text())
          history = json.loads(Path("data/earnings_predictions_log.json").read_text())
          assert output["fetch_error"] is None, output["fetch_error"]
          assert isinstance(output["picks"], list)
          assert isinstance(history, list)
          assert any(d["stage"] == "json_output" for d in output["diagnostics"])
          print(f"JSON validated: picks={len(output['picks'])}, prediction_records={len(history)}")
          PY
      - name: Preserve earnings execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upcoming-earnings-evidence-${{ github.run_id }}
          retention-days: 14
          path: |
            artifacts/upcoming-earnings/
            upcoming_earnings.json
            data/earnings_predictions_log.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upcoming_earnings.json data/earnings_predictions_log.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update upcoming earnings watch"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push upcoming earnings update after 3 attempts."
          exit 1
