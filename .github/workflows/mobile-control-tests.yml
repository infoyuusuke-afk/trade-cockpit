name: Mobile Control Tests
on:
  pull_request:
    paths:
      - "scripts/build_mobile_approvals.py"
      - "scripts/calibrate_ev.py"
      - "scripts/export_ev_trades.py"
      - "tests/test_mobile_approvals.py"
      - "tests/test_ev_calibration.py"
      - "tests/test_export_ev_trades.py"
      - "scripts/strategy_registry.py"
      - "scripts/backtest_15s.py"
      - "scripts/signal_features.py"
      - "tests/test_strategy_registry.py"
      - "tests/test_backtest_15s.py"
      - "tests/test_or5_vwap_backtest.py"
      - "tests/test_signal_features.py"
      - "tests/test_backtest_feature_snapshots.py"
      - "data/ev_calibration.json"
      - "data/strategy_registry.json"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_mobile_approvals tests.test_ev_calibration tests.test_export_ev_trades tests.test_strategy_registry tests.test_backtest_15s tests.test_or5_vwap_backtest tests.test_signal_features tests.test_backtest_feature_snapshots -v
