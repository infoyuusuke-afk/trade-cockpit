name: Mobile Control Tests
on:
  pull_request:
    paths:
      - "scripts/build_mobile_approvals.py"
      - "scripts/calibrate_ev.py"
      - "scripts/export_ev_trades.py"
      - "tests/test_mobile_approvals.py"
      - "tests/test_ev_calibration.py"
      - "tests/test_export_ev_trades.py"
      - "data/ev_calibration.json"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_mobile_approvals tests.test_ev_calibration tests.test_export_ev_trades -v
