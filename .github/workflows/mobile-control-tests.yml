name: Mobile Control Tests
on:
  pull_request:
    paths:
      - "scripts/build_mobile_approvals.py"
      - "scripts/owner_approval_queue.py"
      - "scripts/execution_contract.py"
      - "scripts/execution_permission.py"
      - "scripts/autonomy_gate.py"
      - "tests/test_mobile_approvals.py"
      - "tests/test_owner_approval_queue.py"
      - "tests/test_execution_contract.py"
      - "tests/test_execution_contract_boundary.py"
      - "tests/test_execution_permission.py"
      - "tests/test_autonomy_gate.py"
      - "tests/test_mobile_ci_scope_contract.py"
      - "data/ev_calibration.json"
      - "data/strategy_registry.json"
      - ".github/workflows/mobile-control-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt lxml
      - name: Fail-closed scope contract (do not run unrelated V8/V9 legacy files)
        run: python -m unittest discover -s tests -p test_mobile_ci_scope_contract.py -v
      - name: Mobile approval and order-safety regressions
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            test_mobile_approvals.py \
            test_owner_approval_queue.py \
            test_execution_contract.py \
            test_execution_contract_boundary.py \
            test_execution_permission.py \
            test_autonomy_gate.py; do
            python -m unittest discover -s tests -p "$suite" -v
          done
