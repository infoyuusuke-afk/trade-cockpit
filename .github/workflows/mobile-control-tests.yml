name: Mobile Control Tests
on:
  pull_request:
    paths:
      - "scripts/build_mobile_approvals.py"
      - "scripts/calibrate_ev.py"
      - "tests/test_mobile_approvals.py"
      - "data/ev_calibration.json"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_mobile_approvals.py" -v
