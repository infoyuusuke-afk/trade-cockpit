name: Mobile Control Tests
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "downloads/START_AI_COCKPIT_V6.ps1"
      - "downloads/INSTALL_AI_COCKPIT_V6.ps1"
      - "downloads/AI_Cockpit_Local_Gateway.ps1"
      - "downloads/DIAG_AI_COCKPIT_V6_EXCEL.ps1"
      - "ms2_live/Kioxia_RSS_Live_Watcher.ps1"
      - "ms2_live/Kioxia_Safety_Heartbeat.ps1"
      - "ms2_live/MS2_RSS_100_Collector.ps1"
      - "data/ev_calibration.json"
      - "data/strategy_registry.json"
      - "data/research_input_schema.json"
      - "data/claude_tradingview_handoff.schema.json"
      - "data/cockpit_event.schema.json"
      - "config/ai_organization_v1.json"
      - ".github/workflows/mobile-control-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt lxml
      - name: Parse Excel startup PowerShell
        shell: pwsh
        run: |
          $files = @(
            "downloads/START_AI_COCKPIT_V6.ps1",
            "downloads/INSTALL_AI_COCKPIT_V6.ps1",
            "downloads/DIAG_AI_COCKPIT_V6_EXCEL.ps1",
            "ms2_live/Kioxia_RSS_Live_Watcher.ps1",
            "ms2_live/Kioxia_Safety_Heartbeat.ps1",
            "ms2_live/MS2_RSS_100_Collector.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ": " + $_.Message) }
              exit 1
            }
          }
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse startup scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ("PSVersion=" + $PSVersionTable.PSVersion.ToString())
          $files = @(
            "downloads/START_AI_COCKPIT_V6.ps1",
            "downloads/INSTALL_AI_COCKPIT_V6.ps1",
            "downloads/DIAG_AI_COCKPIT_V6_EXCEL.ps1",
            "downloads/AI_Cockpit_Local_Gateway.ps1",
            "ms2_live/Kioxia_RSS_Live_Watcher.ps1",
            "ms2_live/Kioxia_Safety_Heartbeat.ps1",
            "ms2_live/MS2_RSS_100_Collector.ps1"
          )
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($err in $errors) {
                Write-Host ("ERROR file=" + $file + " line=" + $err.Extent.StartLineNumber + " col=" + $err.Extent.StartColumnNumber + " text=[" + $err.Extent.Text + "] message=" + $err.Message) -ForegroundColor Red
              }
            } else {
              Write-Host ("PASS " + $file) -ForegroundColor Green
            }
          }
          if ($failed) { exit 1 }
