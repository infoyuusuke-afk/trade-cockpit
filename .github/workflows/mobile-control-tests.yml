name: Mobile Control Tests
on:
  pull_request:
    paths:
      - "scripts/build_mobile_approvals.py"
      - "scripts/calibrate_ev.py"
      - "scripts/export_ev_trades.py"
      - "tests/test_mobile_approvals.py"
      - "tests/test_ev_calibration.py"
      - "tests/test_export_ev_trades.py"
      - "scripts/strategy_registry.py"
      - "scripts/backtest_15s.py"
      - "scripts/signal_features.py"
      - "scripts/analyze_ev_features.py"
      - "scripts/run_research_pipeline.py"
      - "scripts/generate_research_report.py"
      - "scripts/validate_oos.py"
      - "scripts/walk_forward.py"
      - "scripts/promotion_gate.py"
      - "tests/test_strategy_registry.py"
      - "tests/test_backtest_15s.py"
      - "tests/test_or5_vwap_backtest.py"
      - "tests/test_signal_features.py"
      - "tests/test_backtest_feature_snapshots.py"
      - "tests/test_ev_feature_buckets.py"
      - "tests/test_research_pipeline.py"
      - "tests/test_research_report.py"
      - "tests/test_oos_validation.py"
      - "tests/test_walk_forward.py"
      - "tests/test_promotion_gate.py"
      - "data/ev_calibration.json"
      - "data/strategy_registry.json"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_mobile_approvals tests.test_ev_calibration tests.test_export_ev_trades tests.test_strategy_registry tests.test_backtest_15s tests.test_or5_vwap_backtest tests.test_signal_features tests.test_backtest_feature_snapshots tests.test_ev_feature_buckets tests.test_research_pipeline tests.test_research_report tests.test_oos_validation tests.test_walk_forward tests.test_promotion_gate -v
