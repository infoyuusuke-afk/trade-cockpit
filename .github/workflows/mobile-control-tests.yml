name: Mobile Control Tests
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/ev_calibration.json"
      - "data/strategy_registry.json"
      - "data/research_input_schema.json"
      - "data/claude_tradingview_handoff.schema.json"
      - "data/cockpit_event.schema.json"
      - "config/ai_organization_v1.json"
      - ".github/workflows/mobile-control-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt lxml
      - run: python -m unittest discover -s tests -p "test_*.py" -v
  windows-checkpoint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt lxml
      - run: python -m unittest tests.test_offline_save_checkpoint tests.test_ms2_offline_csv_snapshot tests.test_ms2_offline_acceptance -v
      - name: Offline synthetic acceptance through OWNER launcher
        shell: cmd
        run: scripts\run_ms2_offline_acceptance.cmd
