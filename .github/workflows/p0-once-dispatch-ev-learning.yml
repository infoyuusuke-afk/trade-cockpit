name: P0 One-Shot EV Learning Recovery
on:
  push:
    branches:
      - p0/trigger-ev-learning-318-once
    paths:
      - '.github/workflows/p0-once-dispatch-ev-learning.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: >-
      github.repository == 'infoyuusuke-afk/trade-cockpit' &&
      github.ref == 'refs/heads/p0/trigger-ev-learning-318-once' &&
      github.event.head_commit.message == 'P0 Owner-approved one-time EV Learning Loop validation after PR318'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production SHA and no EV run in progress; dispatch exact main once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="repos/infoyuusuke-afk/trade-cockpit"
          main_sha="$(gh api "${root}/git/ref/heads/main" --jq '.object.sha')"
          test "${main_sha}" = "cffa036fee4f469231e957dc4e4c0c2fccebc06b" || { echo "::error::Main changed; no dispatch"; exit 1; }
          workflow="$(gh api "${root}/contents/.github/workflows/ev-learning-loop.yml?ref=main" --jq .content | base64 -d)"
          printf '%s' "${workflow}" | grep -F 'python -m pip install -r requirements.txt lxml' >/dev/null || { echo "::error::Fix not present"; exit 1; }
          active="$(gh api "${root}/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.name=="EV Learning Loop" and .status!="completed")] | length')"
          test "${active}" = 0 || { echo "::error::EV job already active"; exit 1; }
          echo "Dispatching EV Learning Loop once on verified main; this does not enable live orders"
          gh api -X POST "${root}/actions/workflows/ev-learning-loop.yml/dispatches" -f ref=main >/dev/null
          echo "Owner-approved one-time EV Learning Loop dispatched on verified main SHA ${main_sha}" >> "${GITHUB_STEP_SUMMARY}"
