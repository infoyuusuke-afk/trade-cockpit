name: MS2 Isolated Observation Offline
on:
  pull_request:
    paths:
      - 'scripts/ms2_isolated_observation.py'
      - 'tests/test_ms2_isolated_observation.py'
      - 'tests/ms2_isolated_benchmark*'
      - '.github/workflows/ms2-isolated-observation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated ingress and inherited durability, integrity, auth, byte pins
        run: python -m unittest tests.test_ms2_isolated_observation tests.test_ms2_ipc_boundaries tests.test_ms2_ipc_security tests.test_ms2_ipc_integrity tests.test_ms2_windows_handoff_e2e tests.test_ms2_nonblocking_handoff tests.test_ms2_ps_python_bridge tests.test_ms2_windows_durable_writer tests.test_ms2_offline_observation_writer tests.test_ms2_watcher_sidecar_contract tests.test_ms2_watcher_integration_preflight -v
      - name: Windows PS5.1 orchestrated Python measurement
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\ms2_isolated_benchmark.ps1
      - name: Linux Python measurement
        if: runner.os == 'Linux'
        run: python -m tests.ms2_isolated_benchmark --output isolated-latency-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-latency-${{ runner.os }}
          path: isolated-latency-*.json
