name: MS2 Legacy CSV Offline Quality
on:
  pull_request:
    paths:
      - scripts/ms2_legacy_csv_audit.py
      - tests/test_ms2_legacy_csv_audit.py
      - .github/workflows/ms2-legacy-csv-audit.yml
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_ms2_legacy_csv_audit tests.test_private_broker_csv_preflight
