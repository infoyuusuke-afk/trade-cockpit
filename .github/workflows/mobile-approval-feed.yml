name: Build Mobile Approval Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "signals.json"
      - "scripts/build_mobile_approvals.py"
      - "data/ev_calibration.json"

permissions:
  contents: read

jobs:
  build:
    environment: main-data-writer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ssh-key: ${{ secrets.MAIN_DATA_WRITER_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build fail-closed mobile feed
        run: python scripts/build_mobile_approvals.py
      - name: Commit generated feed
        run: |
          if git diff --quiet -- data/mobile_approval_requests.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mobile_approval_requests.json
          git commit -m "Update mobile approval feed"
          git push
