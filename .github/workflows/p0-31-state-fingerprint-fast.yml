name: P0-31 Read-Only State Fingerprint CI
on:
  pull_request:
    paths:
      - "downloads/VERIFY_V10_LEGACY_OWNER_READONLY_V1.ps1"
      - "tests/test_v10_owner_state_fingerprint.py"
      - "docs/V10_P0_27_OWNER_READONLY_DELIVERY.md"
      - ".github/workflows/p0-31-state-fingerprint-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ps51:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell 5.1 wrapper
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path "downloads/VERIFY_V10_LEGACY_OWNER_READONLY_V1.ps1").Path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw "P0_31_PARSE_FAILED"}
      - name: P0-31 synthetic state mtime check stays fail-closed
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_owner_state_fingerprint.py -v
  ubuntu-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_v10_owner_state_fingerprint.py -v
