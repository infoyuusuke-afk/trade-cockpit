name: MS2 PowerShell Python Bridge
on:
  pull_request:
    paths:
      - "scripts/ms2_ps_python_bridge.py"
      - "scripts/ms2_ps_python_bridge_producer.ps1"
      - "scripts/ms2_bridge_record.py"
      - "scripts/ms2_nonblocking_handoff.py"
      - "tests/test_ms2_ps_python_bridge.py"
      - "tests/test_ms2_ps_python_bridge.ps1"
      - "tests/ms2_ps_bridge_first_submit_probe.ps1"
      - ".github/workflows/ms2-ps-python-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve pinned bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_ms2_ps_python_bridge tests.test_ms2_nonblocking_handoff -v
  windows-synthetic:
    runs-on: windows-latest
    steps:
      - name: Preserve pinned bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic PowerShell mapping checks without Excel or brokerage data
        shell: powershell
        run: .\tests\test_ms2_ps_python_bridge.ps1
      - name: First-submit cost probe (diagnostic, fresh processes, no assertion)
        if: always()
        shell: powershell
        run: |
          foreach ($i in 1, 2, 3) {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\ms2_ps_bridge_first_submit_probe.ps1 -Mode submit
            powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\ms2_ps_bridge_first_submit_probe.ps1 -Mode submit_notrace
            powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\ms2_ps_bridge_first_submit_probe.ps1 -Mode primitives
          }
