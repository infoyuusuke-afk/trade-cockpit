name: V10 Candidate Runtime Bundle (Synthetic)
on:
  pull_request:
    paths:
      - "downloads/*V10*.ps1"
      - "downloads/V10_RELEASE_BUNDLE_MANIFEST.json"
      - "scripts/ai_brain_observer.py"
      - "scripts/ai_shadow_supervisor.py"
      - "ms2_live/*.ps1"
      - "ms2_live/watchlist_100.json"
      - "scripts/ci_v10_watchlist_replacement.py"
      - "tests/test_v10_watchlist_replacement.py"
      - "index.html"
      - "card_system.*"
      - "card_table_adapter.*"
      - "voice_client.js"
      - "opportunity_radar.js"
      - "trade_control.js"
      - "tests/v10_trade_control_missing_data.test.mjs"
      - "tests/v10_control_performance_lanes.test.mjs"
      - "scripts/v10_control_paper_provenance_adapter.py"
      - "tests/test_v10_control_paper_provenance_adapter.py"
      - "v10_publication_status.js"
      - "tests/test_v10_runtime_bundle_candidate.py"
      - "tests/test_v10_local_http_security.py"
      - "tests/test_v10_brain*.py"
      - "tests/test_v10_ui_evidence_regression.py"
      - "tests/test_v10_ui_mission_navigation.py"
      - "tests/v10_focus_owner_runtime.test.mjs"
      - "tests/v10_ms2_provenance_runtime.test.mjs"
      - "tests/v10_all_live_lanes_silence.test.mjs"
      - "tests/v10_kioxia_render_escape.test.mjs"
      - "tests/v10_agent_research_view.test.mjs"
      - "tests/v10_signal_ev_ranking.test.mjs"
      - "tests/test_v10_signal_ev.py"
      - "scripts/v10_signal_ev_table.py"
      - "scripts/v10_pts_pickup.py"
      - "tests/test_v10_pts_pickup.py"
      - "scripts/v10_brain_core.py"
      - "tests/test_v10_brain_core.py"
      - "tests/test_v10_stale_display_and_escape.py"
      - ".github/workflows/v10-candidate-runtime-bundle-synthetic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare 24 unchanged + 1 OWNER-approved watchlist + pinned UI / health-loss / freshness repairs
        shell: bash
        run: |
          set -euo pipefail
          pinned="e906dedc45448ca20428a7ca1afa1126eaeeedaa"
          git fetch --no-tags --depth=1 origin "$pinned"
          python -m json.tool downloads/V10_RELEASE_BUNDLE_MANIFEST.json > /dev/null
          mapfile -t files < <(python -c 'import json; print("\n".join(item["path"] for item in json.load(open("downloads/V10_RELEASE_BUNDLE_MANIFEST.json", encoding="utf-8"))["files"]))')
          test "${#files[@]}" -eq 31
          for file in "${files[@]}"; do
            test -f "$file"
            git cat-file -e "$pinned:$file"
            if [ "$file" = "index.html" ]; then
              # Independent-review candidate only: exact index.html blob.
              # No general source-pin relaxation and no runtime authorization.
              expected="$(python -c 'import json,sys; m=json.load(open("downloads/V10_RELEASE_BUNDLE_MANIFEST.json",encoding="utf-8")); print(next(i["git_blob_sha"] for i in m["files"] if i["path"] == sys.argv[1]))' "$file")"
              test "$expected" = "5a346cdca2eb7a0a2e925485df32ec920de3af7d"
              test "$(git rev-parse "HEAD:$file")" = "$expected"
              test "$(git rev-parse "$pinned:$file")" != "$expected"
              echo "V10_UI_CANDIDATE_EXACT_BLOB=$expected"
            elif [[ "$file" == "opportunity_radar.js" ]]; then
              # Exact reviewed change for 12s screen admission; SCALP 5 pins
              # Kioxia 285A.T (464A.T is QPS HD, not Kioxia); NOT a wildcard manifest exception.
              expected="$(python -c 'import json,sys; m=json.load(open("downloads/V10_RELEASE_BUNDLE_MANIFEST.json",encoding="utf-8")); print(next(i["git_blob_sha"] for i in m["files"] if i["path"] == sys.argv[1]))' "$file")"
              test "$expected" = "e2f97131c1860f1e9f827571cc26a2f24006c635"
              test "$(git rev-parse "HEAD:$file")" = "$expected"
              test "$(git rev-parse "$pinned:$file")" != "$expected"
              echo "V10_RADAR_PROVENANCE_CANDIDATE_EXACT_BLOB=$expected"
            elif [[ "$file" == "trade_control.js" ]]; then
              # P0 V10 UI data-integrity repair. Exact blob is reviewed and
              # pinned in the manifest; no general source-pin exemption.
              # Missing numeric values must never become measured zero.
              expected="$(python -c 'import json,sys; m=json.load(open("downloads/V10_RELEASE_BUNDLE_MANIFEST.json",encoding="utf-8")); print(next(i["git_blob_sha"] for i in m["files"] if i["path"] == sys.argv[1]))' "$file")"
              test "$(git rev-parse "HEAD:$file")" = "$expected"
              test "$(git rev-parse "$pinned:$file")" != "$expected"
              echo "V10_UI_NULL_DISPLAY_REPAIR=$file"
            elif [[ "$file" == "ms2_live/watchlist_100.json" ]]; then
              # OWNER-approved one-symbol replacement, never a general source-pin bypass.
              # Check manifest pin, original ordering, EXACTLY one changed stock
              # with approved names/codes, and unique tickers.
              expected="$(python -c 'import json,sys; m=json.load(open("downloads/V10_RELEASE_BUNDLE_MANIFEST.json",encoding="utf-8")); print(next(i["git_blob_sha"] for i in m["files"] if i["path"] == sys.argv[1]))' "$file")"
              test "$(git rev-parse "HEAD:$file")" = "$expected"
              git show "$pinned:$file" > /tmp/v10_pinned_watchlist.json
              python scripts/ci_v10_watchlist_replacement.py "$file" /tmp/v10_pinned_watchlist.json
              echo "V10_OWNER_APPROVED_WATCHLIST=$file"
            elif [[ "$file" == "scripts/ai_shadow_supervisor.py" ]]; then
              # P0-V10-ACCEPTANCE-FIX-20261019 quote-freshness repair (writer
              # time is not quote time). Locked to the manifest blob; the
              # synthetic proof is tests/test_v10_price_freshness.py.
              expected="$(python -c 'import json,sys; m=json.load(open("downloads/V10_RELEASE_BUNDLE_MANIFEST.json",encoding="utf-8")); print(next(i["git_blob_sha"] for i in m["files"] if i["path"] == sys.argv[1]))' "$file")"
              test "$(git rev-parse "HEAD:$file")" = "$expected"
              test "$(git rev-parse "HEAD:$file")" != "$(git rev-parse "$pinned:$file")"
              echo "V10_PRICE_FRESHNESS_REPAIR=$file"
            elif [[ "$file" == "scripts/ai_brain_observer.py" ||
                    "$file" == "downloads/AI_COCKPIT_CONTROLLER_V10.ps1" ]]; then
              # P0-V10-INTEGRATION-AND-LIVE-START-20261020: the Brain observer
              # reads only rows the Collector marked FRESH, and the Controller
              # keeps previous worker logs instead of deleting them. Each is
              # locked to the reviewed HEAD:path blob in the manifest.
              expected="$(python -c 'import json,sys; m=json.load(open("downloads/V10_RELEASE_BUNDLE_MANIFEST.json",encoding="utf-8")); print(next(i["git_blob_sha"] for i in m["files"] if i["path"] == sys.argv[1]))' "$file")"
              test "$(git rev-parse "HEAD:$file")" = "$expected"
              test "$(git rev-parse "HEAD:$file")" != "$(git rev-parse "$pinned:$file")"
              echo "V10_INTEGRATION_REPAIR=$file"
            elif [[ "$file" == "downloads/STOP_AI_COCKPIT_V10.ps1" ]]; then
              # OWNER 2026-10-22 S1/S3: Safe Stop quits Excel only when no other
              # workbook is open in it, and stops nothing while another Excel
              # runs. Locked to the reviewed HEAD:path blob in the manifest.
              expected="$(python -c 'import json,sys; m=json.load(open("downloads/V10_RELEASE_BUNDLE_MANIFEST.json",encoding="utf-8")); print(next(i["git_blob_sha"] for i in m["files"] if i["path"] == sys.argv[1]))' "$file")"
              test "$(git rev-parse "HEAD:$file")" = "$expected"
              test "$(git rev-parse "HEAD:$file")" != "$(git rev-parse "$pinned:$file")"
              echo "V10_OWNER_EXCEL_SAFETY_REPAIR=$file"
            elif [[ "$file" == "downloads/AI_COCKPIT_GATEWAY_V10.ps1" ||
                    "$file" == "downloads/AI_COCKPIT_VOICE_BRIDGE_V10.ps1" ||
                    "$file" == "ms2_live/MS2_RSS_100_Collector.ps1" ||
                    "$file" == "ms2_live/Kioxia_RSS_Live_Watcher.ps1" ]]; then
              # Four explicit security repairs, each locked to the reviewed
              # HEAD:path blob, not falsely claimed identical to prior V10.
              expected="$(python -c 'import json,sys; m=json.load(open("downloads/V10_RELEASE_BUNDLE_MANIFEST.json",encoding="utf-8")); print(next(i["git_blob_sha"] for i in m["files"] if i["path"] == sys.argv[1]))' "$file")"
              test "$(git rev-parse "HEAD:$file")" = "$expected"
              test "$(git rev-parse "HEAD:$file")" != "$(git rev-parse "$pinned:$file")"
              echo "V10_LOCAL_HTTP_SECURITY_REPAIR=$file"
            else
              git show "$pinned:$file" | cmp - "$file"
              echo "CANDIDATE_SOURCE_UNMODIFIED=$file"
            fi
          done
          echo "APPROVED_FOR_RUNTIME=0"
      - name: Watchlist replacement check rejects wrong name, ticker, order and manifest tampering
        run: python -m unittest discover -s tests -p test_v10_watchlist_replacement.py -v
      - name: OWNER-fixed FOCUS and mission UI source negative regressions
        run: |
          python -m unittest discover -s tests -p test_v10_ui_evidence_regression.py -v
          python -m unittest discover -s tests -p test_v10_ui_mission_navigation.py -v
      - name: V10 stale 09-25 display and KIOXIA external JSON escaping (FIX-02/FIX-03)
        run: |
          python -m unittest discover -s tests -p test_v10_stale_display_and_escape.py -v
          node --test tests/v10_kioxia_render_escape.test.mjs
          node --test tests/v10_agent_research_view.test.mjs
          node --test tests/v10_signal_ev_ranking.test.mjs
          python -m unittest discover -s tests -p test_v10_signal_ev.py -v
          python -m unittest discover -s tests -p test_v10_pts_pickup.py -v
          python -m unittest discover -s tests -p test_v10_brain_core.py -v
      - name: V10 UI missing metrics and no false zeros
        run: node --test tests/v10_trade_control_missing_data.test.mjs
      - name: V10 CONTROL strategy performance provenance and mode isolation
        run: node --test tests/v10_control_performance_lanes.test.mjs
      - name: V10 CONTROL PAPER evidence adapter negative tests (pure, no publication)
        run: python -m unittest discover -s tests -p test_v10_control_paper_provenance_adapter.py -v
      - name: V10 local HTTP security static contract
        run: python -m unittest discover -s tests -p test_v10_local_http_security.py -v
      - name: Candidate manifest and V10 static UI/runtime dependencies
        run: python -m unittest discover -s tests -p test_v10_runtime_bundle_candidate.py -v
      - name: V10 guarded entry static contracts
        run: python -m unittest discover -s tests -p test_v10_guarded_launch_main.py -v
  windows-parser-and-mock:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse candidate runtime PowerShell scripts without launching anything
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'downloads/RUN_AI_COCKPIT_V10.ps1',
            'downloads/AI_COCKPIT_CONTROLLER_V10.ps1',
            'downloads/EXCEL_IDENTITY_PROBE_V10.ps1',
            'downloads/AI_COCKPIT_GATEWAY_V10.ps1',
            'downloads/AI_COCKPIT_VOICE_BRIDGE_V10.ps1',
            'downloads/STOP_AI_COCKPIT_V10.ps1',
            'downloads/AI_COCKPIT_V10_BRAIN_PREFLIGHT.ps1',
            'ms2_live/Kioxia_RSS_Live_Watcher.ps1',
            'ms2_live/Kioxia_Safety_Heartbeat.ps1',
            'ms2_live/MS2_RSS_100_Collector.ps1',
            'ms2_live/MS2_Common_Engine.ps1',
            'ms2_live/BUILD_KIOXIA_TIME_STATS.ps1',
            'ms2_live/SPEAK_TODAY_STRATEGY.ps1',
            'ms2_live/SPEAK_LIVE_EMOTION.ps1'
          )
          foreach ($path in $paths) {
            $tokens=$null; $parseErrors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ('V10_CANDIDATE_PS_PARSE_FAILED: ' + $path + ' count=' + $parseErrors.Count) }
          }
      - name: Windows local HTTP genuine listener security and negative requests
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_local_http_security.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source manifest / UI source acceptance
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_runtime_bundle_candidate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows guarded start with fake reviewed RUN only (NO OWNER RUNTIME)
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_guarded_launch_main.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Original safe-stop source contracts and exact argv regressions
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_brain_safestop_preflight.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_v10_brain_argv_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Original 19 safe-stop cases on disposable hosted processes only
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_brain_safestop_windows_integration.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
