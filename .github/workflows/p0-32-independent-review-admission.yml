name: P0-32 Independent Review Admission
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested, converted_to_draft]
    paths:
      - "scripts/ci_p0_32_independent_review_gate.py"
      - "tests/test_ci_p0_32_independent_review_gate.py"
      - ".github/workflows/p0-32-independent-review-admission.yml"
  pull_request_review:
    types: [submitted, dismissed, edited]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  gate-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_ci_p0_32_independent_review_gate.py -v
  independent-admission:
    needs: [gate-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Current SHA independent GitHub reviewer proof - required before real acceptance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_p0_32_independent_review_gate.py
