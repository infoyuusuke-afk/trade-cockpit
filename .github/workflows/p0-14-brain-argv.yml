name: P0-14 BRAIN exact argv regression
on:
  pull_request:
    paths:
      - downloads/STOP_AI_COCKPIT_V10.ps1
      - tests/test_v10_brain_argv_contract.py
      - tests/test_v10_brain_safestop_windows_integration.py
      - tests/test_v10_brain_safestop_preflight.py
      - .github/workflows/p0-14-brain-argv.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-synthetic:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove three decoys expose the original bug (dummy processes only)
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile, unittest
          sys.path.insert(0, 'tests')
          import test_v10_brain_safestop_windows_integration as regression
          old = subprocess.check_output(['git', 'show', '3a4f835ccbbdce280cb5488de4df6c1ac892548d:downloads/STOP_AI_COCKPIT_V10.ps1'])
          names = ['test_python_c_with_all_brain_paths_is_not_owned', 'test_script_path_suffix_is_not_owned', 'test_duplicate_status_override_is_not_owned']
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as tmp:
              regression.STOP = pathlib.Path(tmp) / 'original-stop.ps1'
              regression.STOP.write_bytes(old)
              suite = unittest.TestSuite(regression.SafeStopWindowsIsolation(name) for name in names)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if len(result.failures) != 3 or result.errors or result.skipped:
                  raise SystemExit('BASELINE_BUG_NOT_REPRODUCED')
              print('BASELINE_EXPECTED_FAILURES=3; SYNTHETIC_ONLY')
      - name: Pure argv validation and source contracts
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_v10_brain_argv_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_v10_brain_safestop_preflight.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Disposable dummy processes only
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_brain_safestop_windows_integration.py -v
