name: Kioxia Breaking Radar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/kioxia-breaking-radar.yml"
      - "scripts/kioxia_breaking_radar.py"
      - "tests/test_kioxia_breaking_radar.py"
      - "docs/KIOXIA_BREAKING_RADAR.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kioxia-breaking-radar.yml"
      - "scripts/kioxia_breaking_radar.py"
      - "tests/test_kioxia_breaking_radar.py"
      - "kioxia_breaking_radar.json"
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: read

concurrency:
  group: kioxia-breaking-radar
  cancel-in-progress: false

jobs:
  bootstrap-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify live public-source reachability without writes
        run: python scripts/kioxia_breaking_radar.py --dry-run
      - name: Run deterministic radar tests
        run: python -m unittest tests.test_kioxia_breaking_radar

  scan:
    environment: main-data-writer
    permissions:
      contents: read
      issues: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ssh-key: ${{ secrets.MAIN_DATA_WRITER_DEPLOY_KEY }}
      - name: Sync latest protected main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan Kioxia official IR, SEC and targeted media
        id: radar
        run: python scripts/kioxia_breaking_radar.py --alert-file /tmp/kioxia-breaking-alert.md
      - name: Run deterministic radar tests
        run: python -m unittest tests.test_kioxia_breaking_radar
      - name: Notify dedicated alert issue
        if: steps.radar.outputs.urgent_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          body = Path("/tmp/kioxia-breaking-alert.md").read_text(encoding="utf-8")
          url = "https://api.github.com/repos/infoyuusuke-afk/trade-cockpit/issues/179/comments"
          req = urllib.request.Request(
              url,
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              assert response.status == 201
          PY
      - name: Publish durable radar evidence
        run: |
          if git diff --quiet -- kioxia_breaking_radar.json data/kioxia_breaking_log.jsonl; then
            echo "No durable radar change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kioxia_breaking_radar.json
          test ! -f data/kioxia_breaking_log.jsonl || git add data/kioxia_breaking_log.jsonl
          git commit -m "Update Kioxia breaking radar"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
