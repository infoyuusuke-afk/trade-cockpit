name: Routine Bridge Tests
on:
  pull_request:
    paths:
      - scripts/routine_bridge.mjs
      - tests/routine_bridge.test.mjs
      - .github/workflows/gpt-claude-routine.yml
      - .github/workflows/routine-bridge-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/routine_bridge.test.mjs
