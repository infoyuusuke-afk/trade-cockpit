name: EV Learning Loop
on:
  workflow_dispatch:
  push:
    paths:
      - "paper_trade_history.json"
      - "scripts/export_ev_trades.py"
      - "scripts/calibrate_ev.py"
      - "scripts/build_mobile_approvals.py"
permissions:
  contents: write
jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Safety tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Export labelled trade results
        run: python scripts/export_ev_trades.py
      - name: Calibrate EV
        run: python scripts/calibrate_ev.py
      - name: Rebuild mobile approval feed
        run: python scripts/build_mobile_approvals.py
      - name: Commit derived data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trade_results.csv data/ev_calibration.json data/mobile_approval_requests.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update EV learning loop outputs"
          git push
