name: MS2 Poll Reconciliation Offline
on:
  pull_request:
    paths:
      - 'scripts/ms2_poll_reconciliation.py'
      - 'tests/*ms2*poll*'
      - '.github/workflows/ms2-poll-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Poll, fault, native and inherited contracts
        run: python -m unittest tests.test_ms2_poll_reconciliation tests.test_ms2_poll_latency tests.test_ms2_drop_evidence tests.test_ms2_native_drop tests.test_ms2_isolated_observation tests.test_ms2_ipc_boundaries tests.test_ms2_ipc_security tests.test_ms2_ipc_integrity tests.test_ms2_windows_handoff_e2e tests.test_ms2_nonblocking_handoff tests.test_ms2_ps_python_bridge tests.test_ms2_windows_durable_writer tests.test_ms2_offline_observation_writer tests.test_ms2_watcher_sidecar_contract tests.test_ms2_watcher_integration_preflight -v
      - name: Native PS51 separate cohorts
        run: python -m tests.ms2_poll_latency --output poll-latency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poll-reconciliation-${{ runner.os }}
          path: poll-latency.json
