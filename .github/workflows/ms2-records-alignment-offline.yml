name: MS2 Q2-Q3 offline source/PIT alignment
on:
  pull_request:
    paths:
      - scripts/ms2_records_alignment_probe.py
      - tests/test_ms2_records_alignment_probe.py
      - docs/MS2_RECORDS_Q2_Q3_ALIGNMENT_CONTRACT_V1.md
      - .github/workflows/ms2-records-alignment-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: MS2 Q1/Q2/Q3 synthetic, no private data or Excel
        shell: bash
        run: python -m unittest discover -s tests -p 'test_ms2_records_*' -v
