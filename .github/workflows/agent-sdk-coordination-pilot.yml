name: 100B isolated Agents SDK coordination pilot (offline synthetic)
# No API credentials and no billable model requests.
on:
  pull_request:
    paths:
      - "scripts/agent_sdk_coordination_pilot.py"
      - "tests/test_agent_sdk_coordination_pilot.py"
      - "scripts/agent_sdk_public_feed_ingest.py"
      - "tests/test_agent_sdk_public_feed_ingest.py"
      - "scripts/agent_sdk_brain_handoff.py"
      - "tests/test_agent_sdk_brain_handoff.py"
      - "scripts/v10_brain_agent_research_receiver.py"
      - "tests/test_v10_brain_agent_research_receiver.py"
      - "scripts/ai_brain_observer.py"
      - "tests/test_v10_brain_observer_agent_receiver.py"
      - "docs/V10_BRAIN_AGENT_RESEARCH_RECEIVER.md"
      - "docs/AGENT_SDK_COORDINATION_PILOT.md"
      - ".github/workflows/agent-sdk-coordination-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-synthetic:
    name: Research-only offline tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile without importing Agents SDK
        run: python -m py_compile scripts/agent_sdk_coordination_pilot.py tests/test_agent_sdk_coordination_pilot.py scripts/agent_sdk_public_feed_ingest.py tests/test_agent_sdk_public_feed_ingest.py scripts/agent_sdk_brain_handoff.py tests/test_agent_sdk_brain_handoff.py scripts/v10_brain_agent_research_receiver.py tests/test_v10_brain_agent_research_receiver.py
      - name: Offline test for 4 roles, fail-closed and no-key denial
        run: python -m unittest discover -s tests -p test_agent_sdk_coordination_pilot.py -v
      - name: Offline official RSS intake and timestamp security tests
        run: python -m unittest discover -s tests -p test_agent_sdk_public_feed_ingest.py -v
      - name: Offline signed research handoff and ACK negative tests
        run: python -m unittest discover -s tests -p test_agent_sdk_brain_handoff.py -v
      - name: V10 Brain receiver (independent verify, durable receipt, Brain ACK, restart, negatives)
        run: python -m unittest discover -s tests -p test_v10_brain_agent_research_receiver.py -v
      - name: V10 Brain observer opt-in receiver (pinned modules, off by default, restart)
        run: python -m unittest discover -s tests -p test_v10_brain_observer_agent_receiver.py -v
      - name: Reproduce Owner Unicode working directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import os,pathlib,shutil; dst=pathlib.Path(os.environ['RUNNER_TEMP'])/'100億PROJECT'/'AGENTS_SDK_PILOT'; [(shutil.copytree(p,dst/p,dirs_exist_ok=True)) for p in ('scripts','tests','examples')]; print('UNICODE_TEST_ROOT_CREATED')"
          $unicodeRoot = Join-Path $env:RUNNER_TEMP '100億PROJECT\AGENTS_SDK_PILOT'
          Push-Location $unicodeRoot
          try {
            python -m unittest discover -s tests -p test_agent_sdk_brain_handoff.py -v
            if ($LASTEXITCODE -ne 0) { throw 'UNICODE_PATH_TEST_FAILED' }
            python -m unittest discover -s tests -p test_v10_brain_agent_research_receiver.py -v
            if ($LASTEXITCODE -ne 0) { throw 'UNICODE_PATH_RECEIVER_TEST_FAILED' }
            python -m unittest discover -s tests -p test_v10_brain_observer_agent_receiver.py -v
            if ($LASTEXITCODE -ne 0) { throw 'UNICODE_PATH_OBSERVER_RECEIVER_TEST_FAILED' }
          } finally {
            Pop-Location
          }
