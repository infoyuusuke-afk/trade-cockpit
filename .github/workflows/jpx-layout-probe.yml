name: JPX layout probe (temporary)

on:
  push:
    branches: [claude/jpx-investor-xlsx]
    paths:
      - "scripts/jpx_layout_probe.py"
      - ".github/workflows/jpx-layout-probe.yml"
      - "scripts/investor_regime.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.3.1 openpyxl==3.1.5 xlrd==2.0.2
      - run: python -m scripts.jpx_layout_probe
