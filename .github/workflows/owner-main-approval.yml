name: Owner Main Approval Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: owner-main-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment:
      name: owner-main-approval
    steps:
      - name: Record explicit owner deployment approval
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'Owner approval accepted for PR #%s at %s\n' "$PR_NUMBER" "$PR_HEAD_SHA"
