name: Owner Main Approval Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: owner-main-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Record owner gate check
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'Owner gate check passed for PR #%s at %s\n' "$PR_NUMBER" "$PR_HEAD_SHA"
