name: Shadow Windows SQLite Candidate Tests
on:
  pull_request:
    paths:
      - "scripts/shadow_forward_windows_sqlite_candidate.py"
      - "tests/test_shadow_forward_windows_sqlite_candidate.py"
      - ".github/workflows/shadow-windows-candidate-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify candidate without enabling Windows private production commits
        run: python -m unittest discover -s tests -p "test_shadow_forward_windows_sqlite_candidate.py" -v
  candidate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify candidate isolation on Linux
        run: python -m unittest discover -s tests -p "test_shadow_forward_windows_sqlite_candidate.py" -v
