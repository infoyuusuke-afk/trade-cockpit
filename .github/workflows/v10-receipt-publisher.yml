name: V10 Receipt Publisher
on:
  pull_request:
    paths:
      - "scripts/ms2_v10_receipt_publisher.py"
      - "tests/test_ms2_v10_receipt_publisher.py"
      - ".github/workflows/v10-receipt-publisher.yml"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_ms2_v10_receipt_publisher.py -v
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_ms2_v10_receipt_publisher.py -v
