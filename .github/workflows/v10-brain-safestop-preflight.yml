name: V10 BRAIN Safe Stop and Read-Only Preflight
on:
  pull_request:
    paths:
      - "downloads/STOP_AI_COCKPIT_V10.ps1"
      - "downloads/STOP_AI_COCKPIT_V10.cmd"
      - "downloads/AI_COCKPIT_V10_BRAIN_PREFLIGHT.ps1"
      - "tests/test_v10_brain_safestop_preflight.py"
      - "tests/test_v10_brain_safestop_windows_integration.py"
      - "downloads/VERIFY_V10_DESKTOP_SAFE_STOP_ROUTE.ps1"
      - "tests/test_v10_desktop_safe_stop_route.py"
      - "downloads/INVENTORY_V10_OWNER_DESKTOP_READONLY.ps1"
      - "tests/test_v10_owner_desktop_inventory.py"
      - "downloads/PREPARE_V10_SAFE_CUTOVER_V1.ps1"
      - "tests/test_v10_safe_cutover_prepare.py"
      - "downloads/VERIFY_V10_SNAPSHOT_RESTORE_REHEARSAL.ps1"
      - "tests/test_v10_snapshot_restore_rehearsal.py"
      - "downloads/VERIFY_V10_RESTORE_TARGET_MAP.ps1"
      - "tests/test_v10_restore_target_map.py"
      - "downloads/VERIFY_V10_ENCRYPTED_RESTORE_MAP.ps1"
      - "tests/test_v10_restore_map_dpapi.py"
      - "downloads/RUN_V10_PRIVATE_MAP_AUDIT_V1.ps1"
      - "tests/test_v10_pinned_local_delivery.py"
      - "downloads/SWITCH_V10_OWNER_LAUNCH_ROUTE.ps1"
      - "tests/test_v10_owner_route_switch.py"
      - "downloads/DIAGNOSE_V10_CONTROLLER_STATE_READONLY.ps1"
      - "tests/test_v10_controller_state_diagnose.py"
      - "downloads/AUDIT_V10_LIVE_PROCESS_OWNERSHIP_READONLY.ps1"
      - "tests/test_v10_live_ownership_readonly.py"
      - "downloads/PREFLIGHT_V10_LEGACY_SHUTDOWN_V1.ps1"
      - "tests/test_v10_legacy_shutdown_preflight.py"
      - "downloads/STOP_V10_LEGACY_SESSION_V1.ps1"
      - "tests/test_v10_legacy_safe_stop.py"
      - "downloads/VERIFY_V10_LEGACY_OWNER_READONLY_V1.ps1"
      - "tests/test_v10_legacy_owner_readonly.py"
      - "downloads/DIAGNOSE_V10_LEGACY_PORT_OWNER_READONLY_V1.ps1"
      - "tests/test_v10_legacy_port_attribution_readonly.py"
      - "tests/test_v10_collector_encoded_init_admission.py"
      - "docs/V10_P0_27_OWNER_READONLY_DELIVERY.md"
      - "docs/V10_BRAIN_SAFE_DEPLOYMENT_ACCEPTANCE.md"
      - ".github/workflows/v10-brain-safestop-preflight.yml"
  workflow_dispatch:
jobs:
  windows-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell 5.1 files
        shell: powershell
        run: |
          foreach ($p in @("downloads/STOP_AI_COCKPIT_V10.ps1","downloads/AI_COCKPIT_V10_BRAIN_PREFLIGHT.ps1","downloads/VERIFY_V10_DESKTOP_SAFE_STOP_ROUTE.ps1","downloads/INVENTORY_V10_OWNER_DESKTOP_READONLY.ps1","downloads/PREPARE_V10_SAFE_CUTOVER_V1.ps1","downloads/VERIFY_V10_SNAPSHOT_RESTORE_REHEARSAL.ps1","downloads/VERIFY_V10_RESTORE_TARGET_MAP.ps1","downloads/VERIFY_V10_ENCRYPTED_RESTORE_MAP.ps1","downloads/RUN_V10_PRIVATE_MAP_AUDIT_V1.ps1","downloads/SWITCH_V10_OWNER_LAUNCH_ROUTE.ps1","downloads/DIAGNOSE_V10_CONTROLLER_STATE_READONLY.ps1","downloads/AUDIT_V10_LIVE_PROCESS_OWNERSHIP_READONLY.ps1","downloads/PREFLIGHT_V10_LEGACY_SHUTDOWN_V1.ps1","downloads/STOP_V10_LEGACY_SESSION_V1.ps1","downloads/VERIFY_V10_LEGACY_OWNER_READONLY_V1.ps1","downloads/DIAGNOSE_V10_LEGACY_PORT_OWNER_READONLY_V1.ps1")) {
            $t=$null; $e=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$t,[ref]$e) | Out-Null
            if ($e.Count -gt 0) { throw "${p}: $e" }
          }
      - name: Fail-closed synthetic preflight
        shell: powershell
        run: |
          & ".\downloads\AI_COCKPIT_V10_BRAIN_PREFLIGHT.ps1" -SelfTest
      - name: Unapproved SHA refused without side effects
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -File ".\downloads\AI_COCKPIT_V10_BRAIN_PREFLIGHT.ps1" -RepoRoot (Get-Location).Path -ExpectedSha ('0'*40) -ExpectedBranch 'not-approved'
          if ($LASTEXITCODE -ne 2) { throw "INVALID_SHA_ACCEPTED" }
          # GitHub's powershell shell propagates LASTEXITCODE even after a
          # successful assertion. Clear only this expected synthetic 2.
          $global:LASTEXITCODE = 0
          Write-Output "PASS: SHA_MISMATCH_REFUSED_NO_SIDE_EFFECTS"
      - run: python -m unittest discover -s tests -p test_v10_brain_safestop_preflight.py -v
      - run: python -m unittest discover -s tests -p test_v10_legacy_owner_readonly.py -v
      - run: python -m unittest discover -s tests -p test_v10_legacy_port_attribution_readonly.py -v
      - run: python -m unittest discover -s tests -p test_v10_collector_encoded_init_admission.py -v
      - name: P0-28 live-port owner diagnostic (read-only synthetic hosts)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_legacy_port_attribution_readonly.py -v
      - name: P0-29 initialized Collector admission synthetic tests
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_collector_encoded_init_admission.py -v
      - name: Isolated real-process Safe Stop acceptance (dummy only)
        shell: pwsh
        run: python -m unittest discover -s tests -p test_v10_brain_safestop_windows_integration.py -v
      - name: Desktop CMD route parser self-test (no command execution)
        shell: powershell
        run: .\downloads\VERIFY_V10_DESKTOP_SAFE_STOP_ROUTE.ps1 -SelfTest
      - name: Pinned Desktop route Windows integration (synthetic repo)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_desktop_safe_stop_route.py -v
      - name: Full OWNER desktop inventory (synthetic Windows only)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_owner_desktop_inventory.py -v
      - name: Safe cutover backup and manifest (isolated Windows only)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_safe_cutover_prepare.py -v
      - name: Restore rehearsal in isolated TEMP (synthetic snapshot only)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_snapshot_restore_rehearsal.py -v
      - name: Hash-exact restore target map (no ordinal or file writes)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_restore_target_map.py -v
      - name: DPAPI CurrentUser protected target map (synthetic only)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_restore_map_dpapi.py -v
      - name: Pinned one-command local delivery (synthetic no-network)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_pinned_local_delivery.py -v
      - name: Pinned reversible route switch (synthetic Windows only)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_owner_route_switch.py -v
      - name: Privacy-filtered old Controller state diagnosis (no writes)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_controller_state_diagnose.py -v
      - name: Synthetic orphan BRAIN ownership and port audit (never stops processes)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_live_ownership_readonly.py -v
      - name: Strict legacy shutdown admission only (seven live-process tests)
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_legacy_shutdown_preflight.py -v
      - name: Legacy session Safe Stop, destructive on disposable synthetic hosts only
        if: always()
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_legacy_safe_stop.py -v
      - name: Non-stopping SHA-pinned OWNER acceptance entry (synthetic hosts only)
        if: always()
        shell: powershell
        run: python -m unittest discover -s tests -p test_v10_legacy_owner_readonly.py -v
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_v10_brain_safestop_preflight.py -v
      - run: python -m unittest discover -s tests -p test_v10_legacy_owner_readonly.py -v
