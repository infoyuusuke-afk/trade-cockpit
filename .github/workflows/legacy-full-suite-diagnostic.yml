# P0-33: explicit diagnostic only. Known archival failures remain RED.
# This does not replace domain-specific CI and is NOT a green acceptance gate.
name: Legacy Full Suite Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-legacy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt lxml
      - name: Run complete historical test inventory (FAIL is visible)
        run: python -m unittest discover -s tests -p "test_*.py" -v
