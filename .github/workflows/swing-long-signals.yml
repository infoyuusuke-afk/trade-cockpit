name: Swing & Long Horizon Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * 1-5" # 15:40 JST 平日（引け後、credit_supply/investor_regime更新後を想定）

permissions:
  contents: write

concurrency:
  group: trade-cockpit-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tag day-layer signals
        run: python scripts/tag_horizons.py
      - name: Generate swing-layer signals
        run: python scripts/swing_signal.py
      - name: Generate long-layer signals
        run: python scripts/long_signal.py
      - name: Build tomorrow's watch TOP5 (decision-time only, no lookahead)
        run: python scripts/watch_top5.py
      - name: Commit and push
        run: |
          if git diff --quiet -- signals_day.json signals_swing.json signals_long.json watch_top5.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals_day.json signals_swing.json signals_long.json watch_top5.json
          git commit -m "Update swing/long horizon signals"
          git pull --rebase origin main
          git push
