name: Swing & Long Horizon Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * 1-5" # 15:40 JST 平日（引け後、credit_supply/investor_regime更新後を想定）

permissions:
  contents: read

concurrency:
  group: trade-cockpit-writer
  cancel-in-progress: false

jobs:
  update:
    environment: main-data-writer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ssh-key: ${{ secrets.MAIN_DATA_WRITER_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tag day-layer signals
        run: python scripts/tag_horizons.py
      - name: Generate swing-layer signals
        run: python scripts/swing_signal.py
      - name: Generate long-layer signals
        run: python scripts/long_signal.py
      - name: Build tomorrow's watch TOP5 (decision-time only, no lookahead)
        run: python scripts/watch_top5.py
      - name: Collect 5-min intraday calendars for watch TOP5 + Kioxia
        run: python scripts/multi_ticker_5m_calendar.py
      - name: Re-run Stage2 method comparison with true OHLC data
        run: python scripts/stage2_backtest_v2.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals_day.json signals_swing.json signals_long.json watch_top5.json data/5m_calendars/ stage2_comparison_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update swing/long horizon signals"
          git pull --rebase origin main
          git push
