name: Calibrate EV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/trade_results.csv"
      - "scripts/calibrate_ev.py"

permissions:
  contents: read

jobs:
  calibrate:
    environment: main-data-writer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ssh-key: ${{ secrets.MAIN_DATA_WRITER_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calibrate empirical EV
        run: python scripts/calibrate_ev.py
      - name: Commit calibration
        run: |
          if git diff --quiet -- data/ev_calibration.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ev_calibration.json
          git commit -m "Update empirical EV calibration"
          git push
