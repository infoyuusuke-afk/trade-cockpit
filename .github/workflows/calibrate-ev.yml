name: Calibrate EV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/trade_results.csv"
      - "scripts/calibrate_ev.py"

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calibrate empirical EV
        run: python scripts/calibrate_ev.py
      - name: Commit calibration
        run: |
          if git diff --quiet -- data/ev_calibration.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ev_calibration.json
          git commit -m "Update empirical EV calibration"
          git push
