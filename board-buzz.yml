name: Board Buzz Ranking Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0-4" # 07:00 JST 平日（寄り付き前、前日分ランキング確認用）

permissions:
  contents: write

concurrency:
  group: trade-cockpit-writer
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Track Yahoo board post-count ranking
        run: python scripts/board_buzz_ranking.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board_buzz_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update board buzz ranking"
          git pull --rebase origin main
          git push
